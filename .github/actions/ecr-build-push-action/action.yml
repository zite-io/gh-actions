name: Build & Push Docker image ECR
description: Builds a Docker image and pushes to AWS ECR.

inputs:
  AWS_REGION:
    description: AWS region
    required: true
  AWS_ROLE_ARN:
    required: true
    description: "IAM Role ARN to assume via GitHub OIDC"

  ECR_REPOSITORY:
    description: ECR repository name
    required: true
  IMAGE_TAG:
    description: Image tag to push in ECR
    default: "latest"
    required: false

  PIP_MODULES_FILE:
    required: false
    default: ./dependencies/requirements.txt
    description: "Path to the pip modules requirements file"
  APT_MODULES_FILE:
    required: false
    default: ./dependencies/apt_requirements.txt
    description: "Path to the apt dependencies requirements file"

  DOCKERFILE_PATH:
    description: Path of the Dockerfile
    required: false
    default: docker/Dockerfile
  BUILD_CONTEXT:
    description: Docker Build context
    required: false
    default: .

  DOMAIN:
    description: Pass Domain for environment selection
    required: true

outputs:
  IMAGE_URI:
    description: Full pushed image URI with tag
    value: ${{ steps.meta.outputs.image_uri }}
  REGISTRY:
    description: ECR registry
    value: ${{ steps.meta.outputs.registry }}
  IMAGE_DIGEST:
    description: Digest of the pushed image
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
  - name: Copy Dependency Files
    shell: bash
    run: |
      set -euo pipefail
      copy_if_needed() {
        local src="$1" dest="$2"
        if [ ! -f "$src" ]; then
          echo "::notice::$src not found — skipping copy to $dest (pass it explicitly, or provide $dest directly, if needed)"
          return 0
        fi
        if [ "$(realpath -m "$src")" = "$(realpath -m "$dest")" ]; then
          echo "::notice::$src already at $dest — skipping copy"
          return 0
        fi
        cp "$src" "$dest"
      }
      copy_if_needed "${{ inputs.APT_MODULES_FILE }}" apt_requirements.txt
      copy_if_needed "${{ inputs.PIP_MODULES_FILE }}" requirements.txt

  - name: Configure AWS Credentials (OIDC)
    uses: aws-actions/configure-aws-credentials@v5
    with:
      role-to-assume: ${{ inputs.AWS_ROLE_ARN }}
      aws-region: ${{ inputs.AWS_REGION }}

  - name: Login to Amazon ECR
    id: ecr
    uses: aws-actions/amazon-ecr-login@v2

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3
    with:
      driver-opts: |
        image=moby/buildkit:latest

  - name: Compute image refs
    id: meta
    shell: bash
    run: |
      set -euo pipefail
      REGISTRY="${{ steps.ecr.outputs.registry }}"
      REPO="${{ inputs.ECR_REPOSITORY }}"
      TAG="${{ inputs.IMAGE_TAG }}"
      IMAGE_URI="${REGISTRY}/${REPO}:${TAG}"
      echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
      echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  - name: Build and push image
    uses: docker/build-push-action@v6
    id: build
    with:
      context: ${{ inputs.BUILD_CONTEXT }}
      file: ${{ inputs.DOCKERFILE_PATH }}
      platforms: linux/amd64
      push: true
      provenance: false
      sbom: false
      tags: |
        ${{ steps.meta.outputs.image_uri }}
        ${{ steps.meta.outputs.registry }}/${{ inputs.ECR_REPOSITORY }}:buildcache
      build-args: |
        DOMAIN=${{ inputs.DOMAIN }}
      cache-from: |
        type=gha,scope=ecr-${{ inputs.ECR_REPOSITORY }}
        type=registry,ref=${{ steps.meta.outputs.registry }}/${{ inputs.ECR_REPOSITORY }}:buildcache
      cache-to: type=gha,mode=max,scope=ecr-${{ inputs.ECR_REPOSITORY }}
